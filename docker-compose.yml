services:
  postgres:
    image: postgres:16-alpine
    container_name: eema-postgres
    environment:
      POSTGRES_DB: eema
      POSTGRES_USER: eema
      POSTGRES_PASSWORD: eema
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eema -d eema"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - eema-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eema-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eema
      SPRING_DATASOURCE_USERNAME: eema
      SPRING_DATASOURCE_PASSWORD: eema
      UPLOAD_DIR: /app/uploads
      DOCUMENT_STORAGE_DIR: /app/private-documents
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - eema-uploads:/app/uploads
      - eema-private-documents:/app/private-documents

volumes:
  eema-postgres-data:
  eema-uploads:
  eema-private-documents:
