version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eema-postgres
    environment:
      POSTGRES_DB: eema
      POSTGRES_USER: eema
      POSTGRES_PASSWORD: eema
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eema"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eema-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ../backend/uploads:/app/uploads
