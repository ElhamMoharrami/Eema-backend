services:
  postgres:
    image: postgres:16-alpine
    container_name: eema-postgres
    environment:
      POSTGRES_DB: eema
      POSTGRES_USER: eema
      POSTGRES_PASSWORD: eema
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eema -d eema"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eema-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eema
      SPRING_DATASOURCE_USERNAME: eema
      SPRING_DATASOURCE_PASSWORD: eema
    ports:
      - "8080:8080"