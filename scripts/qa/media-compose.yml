services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eema_media_qa
      POSTGRES_USER: eema
      POSTGRES_PASSWORD: eema
    ports:
      - '127.0.0.1:15443:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U eema -d eema_media_qa']
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: eema-media-qa-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eema_media_qa
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/common
      EMAIL_NOTIFICATIONS_ENABLED: 'false'
      UPLOAD_DIR: /app/uploads
      DOCUMENT_STORAGE_DIR: /app/private-documents
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - media:/app/uploads
      - private-documents:/app/private-documents
volumes:
  media:
  private-documents:
