# Example local configuration. Copy to application-local.yml and fill in the values.
spring:
  application:
    name: eema-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eema
    username: eema
    password: eema
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: tjeiMgh/atru5Mg8siRlg5U6uEabZER2OCGy2I9SIEE=
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    upload-dir: ./uploads
  cors:
    allowed-origins: http://localhost:3000
  admin:
    email-allowlist: admin@example.com
  mollie:
    api-key: your-mollie-api-key
    webhook-secret: your-mollie-webhook-secret
  gemini:
    api-key: your-gemini-api-key
  resend:
    api-key: your-resend-api-key
    from-email: bookings@eema.co
  sentry:
    dsn: your-sentry-dsn

logging:
  level:
    com.eema: INFO
    org.springframework.security: WARN