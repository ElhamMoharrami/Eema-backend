# Example local configuration. Copy to application-local.yml and fill in the values.
spring:
  application:
    name: eema-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eema
    username: eema
    password: eema
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LTMyaA==}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    upload-dir: ./uploads
  cors:
    allowed-origins: http://localhost:3000
  admin:
    email-allowlist: admin@example.com
  mollie:
    api-key: ${MOLLIE_API_KEY:}
    redirect-url: ${MOLLIE_REDIRECT_URL:http://localhost:3000/booked}
    webhook-url: ${MOLLIE_WEBHOOK_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  resend:
    api-key: your-resend-api-key
    from-email: bookings@eema.co
  sentry:
    dsn: your-sentry-dsn
  commission:
    percentage: 4.00  # Commission percentage (e.g., 4.00 for 4%)

logging:
  level:
    com.eema: INFO
    org.springframework.security: WARN
