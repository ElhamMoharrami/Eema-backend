# Local development profile. Docker Compose overrides the datasource URL with Docker DNS.
spring:
  application:
    name: eema-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eema
    username: eema
    password: eema
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

app:
  availability-inquiry:
    offer-valid-hours: ${AVAILABILITY_INQUIRY_OFFER_VALID_HOURS:48}
    expiration-scan-delay-ms: ${AVAILABILITY_INQUIRY_EXPIRATION_SCAN_DELAY_MS:60000}
  booking-workflow:
    payment-window-hours: ${BOOKING_PAYMENT_WINDOW_HOURS:24}
    owner-response-window-hours: ${BOOKING_OWNER_RESPONSE_WINDOW_HOURS:24}
    expiration-scan-delay-ms: ${BOOKING_EXPIRATION_SCAN_DELAY_MS:60000}
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LTMyaA==}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    provider: local
    upload-dir: ${UPLOAD_DIR:./uploads}
    file-url-prefix: ${FILE_URL_PREFIX:/api/upload/files/}
    max-file-size-bytes: ${MAX_UPLOAD_FILE_SIZE_BYTES:5242880}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin-email-allowlist: ${ADMIN_EMAIL_ALLOWLIST:}
  mollie:
    api-key: ${MOLLIE_API_KEY:}
    redirect-url: ${MOLLIE_REDIRECT_URL:http://localhost:3000/booked}
    webhook-url: ${MOLLIE_WEBHOOK_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  resend:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:bookings@eema.local}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  commission:
    percentage: 4.00  # Commission percentage (e.g., 4.00 for 4%)

logging:
  level:
    com.eema: INFO
    org.springframework.security: WARN
