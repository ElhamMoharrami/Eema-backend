spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration/common

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.client.RestTemplate: WARN
    org.apache.http.wire: OFF

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL}
  resend:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    upload-dir: ${UPLOAD_DIR}
    file-url-prefix: ${FILE_URL_PREFIX}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
