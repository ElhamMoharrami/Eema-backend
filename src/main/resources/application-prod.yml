spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration/common

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p requestId=%X{requestId:-} logger=%logger{36} message=%m%n"
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.client.RestTemplate: WARN
    org.apache.http.wire: OFF

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL}
  resend:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    provider: s3
    upload-dir: /nonpersistent-unused
    file-url-prefix: ${FILE_URL_PREFIX:/api/upload/files/}
    max-file-size-bytes: ${MAX_UPLOAD_FILE_SIZE_BYTES:5242880}
  documents:
    storage-dir: /nonpersistent-unused
  security:
    hsts-enabled: true

server:
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
