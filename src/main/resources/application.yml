spring:
  application:
    name: eema
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eema}
    username: ${SPRING_DATASOURCE_USERNAME:eema}
    password: ${SPRING_DATASOURCE_PASSWORD:eema}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Log the request/response details from RestTemplate
    org.springframework.web.client.RestTemplate: DEBUG
    # Log our own service at INFO (or DEBUG if you want more)
    com.eema.backend.service.ai: INFO
    # Optional: see the raw HTTP wire traffic (requires spring-boot-starter-logging)
    org.apache.http.wire: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

app:
  jwt:
    secret: fRGDyDVTthYtZ+rNvijhiAWox290QmZuouDlUC0sNddnF803lbJud6r308dHQHNDZazfxUvpu66muD4TOox49w==
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    uploadDir: ${UPLOAD_DIR:/tmp/uploads}
    fileUrlPrefix: ${FILE_URL_PREFIX:/api/files/}
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  adminEmailAllowlist: ${ADMIN_EMAIL_ALLOWLIST:}
  gemini:
    api-key: "${GEMINI_API_KEY:REDACTED_EXPOSED_CREDENTIAL}"   # allows overriding via env var, fails fast if missing
  commission:
    percentage: ${COMMISSION_PERCENTAGE:4.00}  # Commission percentage (e.g., 4.00 for 4%)
  mollie:
    api-key: "${MOLLIE_API_KEY:#{null}}"
    webhook-secret: "${MOLLIE_WEBHOOK_SECRET:#{null}}"
    redirect-url: "${MOLLIE_REDIRECT_URL:https://example.com}"