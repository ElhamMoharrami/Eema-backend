spring:
  application:
    name: eema
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eema}
    username: ${SPRING_DATASOURCE_USERNAME:eema}
    password: ${SPRING_DATASOURCE_PASSWORD:eema}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web.client.RestTemplate: DEBUG
    com.eema.backend.service.ai: INFO
    org.apache.http.wire: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    upload-dir: ${UPLOAD_DIR:/tmp/uploads}
    file-url-prefix: ${FILE_URL_PREFIX:/api/files/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  admin-email-allowlist: ${ADMIN_EMAIL_ALLOWLIST:}
  gemini:
    api-key: ${GEMINI_API_KEY}
  commission:
    percentage: ${COMMISSION_PERCENTAGE:20.00}
  mollie:
    api-key: ${MOLLIE_API_KEY:REDACTED_EXPOSED_CREDENTIAL}
    redirect-url: ${MOLLIE_REDIRECT_URL:http://localhost:3000/booked}
    webhook-url: ${MOLLIE_WEBHOOK_URL}
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}
  calendly:
    base-url: ${CALENDLY_BASE_URL}