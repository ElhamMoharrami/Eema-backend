spring:
  application:
    name: eema
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eema}
    username: ${SPRING_DATASOURCE_USERNAME:eema}
    password: ${SPRING_DATASOURCE_PASSWORD:eema}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Do not reuse pre-lock entities across service transactions in an HTTP request.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:6MB}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: ${MAX_FORM_POST_SIZE:6MB}
    max-swallow-size: ${MAX_SWALLOW_SIZE:6MB}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.client.RestTemplate: INFO
    com.eema.backend.service.ai: INFO
    org.apache.http.wire: WARN

app:
  payout-destination:
    enabled: ${PAYOUT_DESTINATIONS_ENABLED:true}
    encryption-key: ${PAYOUT_DATA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    fingerprint-key: ${PAYOUT_DATA_FINGERPRINT_KEY:ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=}
  auth-recovery:
    email-verification-token-hours: ${EMAIL_VERIFICATION_TOKEN_HOURS:24}
    password-reset-token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:60}
    cleanup-delay-ms: ${AUTH_TOKEN_CLEANUP_DELAY_MS:3600000}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  documents:
    storage-dir: ${DOCUMENT_STORAGE_DIR:/tmp/eema-private-documents}
  workflow-observability:
    scan-delay-ms: ${WORKFLOW_OBSERVABILITY_SCAN_DELAY_MS:300000}
    payment-creating-stuck-minutes: ${PAYMENT_CREATING_STUCK_MINUTES:60}
    refund-stuck-minutes: ${REFUND_STUCK_MINUTES:1440}
    fee-unreconciled-minutes: ${FEE_UNRECONCILED_MINUTES:1440}
    payout-ready-overdue-hours: ${PAYOUT_READY_OVERDUE_HOURS:72}
  payout:
    readiness-scan-delay-ms: ${PAYOUT_READINESS_SCAN_DELAY_MS:300000}
  availability-inquiry:
    offer-valid-hours: ${AVAILABILITY_INQUIRY_OFFER_VALID_HOURS:48}
    expiration-scan-delay-ms: ${AVAILABILITY_INQUIRY_EXPIRATION_SCAN_DELAY_MS:60000}
  booking-workflow:
    payment-window-hours: ${BOOKING_PAYMENT_WINDOW_HOURS:24}
    owner-response-window-hours: ${BOOKING_OWNER_RESPONSE_WINDOW_HOURS:24}
    expiration-scan-delay-ms: ${BOOKING_EXPIRATION_SCAN_DELAY_MS:60000}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  storage:
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${UPLOAD_DIR:/tmp/uploads}
    file-url-prefix: ${FILE_URL_PREFIX:/api/upload/files/}
    max-file-size-bytes: ${MAX_UPLOAD_FILE_SIZE_BYTES:5242880}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      public-media-bucket: ${S3_BUCKET_PUBLIC_MEDIA:}
      private-documents-bucket: ${S3_BUCKET_PRIVATE_DOCUMENTS:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  admin-email-allowlist: ${ADMIN_EMAIL_ALLOWLIST:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  commission:
    percentage: ${COMMISSION_PERCENTAGE:20.00}
  mollie:
    api-key: ${MOLLIE_API_KEY:}
    redirect-url: ${MOLLIE_REDIRECT_URL:http://localhost:3000/booked}
    webhook-url: ${MOLLIE_WEBHOOK_URL:}
    reporting-access-token: ${MOLLIE_REPORTING_ACCESS_TOKEN:}
    fee-reconciliation-enabled: ${MOLLIE_FEE_RECONCILIATION_ENABLED:false}
    fee-reconciliation-delay-ms: ${MOLLIE_FEE_RECONCILIATION_DELAY_MS:3600000}
    fee-reconciliation-initial-delay-ms: ${MOLLIE_FEE_RECONCILIATION_INITIAL_DELAY_MS:60000}
  # PostgreSQL dispatch intent is always recorded, even when sending is disabled.
  notification-outbox:
    enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
    lease-seconds: ${NOTIFICATION_OUTBOX_LEASE_SECONDS:300}
    initial-backoff-seconds: ${NOTIFICATION_OUTBOX_INITIAL_BACKOFF_SECONDS:30}
    max-backoff-seconds: ${NOTIFICATION_OUTBOX_MAX_BACKOFF_SECONDS:3600}
    poll-delay-ms: ${NOTIFICATION_OUTBOX_POLL_DELAY_MS:10000}
    initial-delay-ms: ${NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:10000}
  resend:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  calendly:
    base-url: ${CALENDLY_BASE_URL:}
  security:
    hsts-enabled: ${HSTS_ENABLED:false}
